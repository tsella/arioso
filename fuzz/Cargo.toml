[package]
name = "arioso-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.arioso-config]
path = "../crates/arioso-config"

[dependencies.arioso-core]
path = "../crates/arioso-core"

[dependencies.arioso-models]
path = "../crates/arioso-models"

[dependencies.arioso-tts-piper]
path = "../crates/arioso-tts-piper"

[[bin]]
name = "config_json"
path = "fuzz_targets/config_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dictionary"
path = "fuzz_targets/dictionary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wav_header"
path = "fuzz_targets/wav_header.rs"
test = false
doc = false
bench = false

