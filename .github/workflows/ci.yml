name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The Piper engine links a native ONNX Runtime, and the vendored copy is
      # gitignored, so CI fetches the release build into the same place.
      - name: onnx runtime
        shell: bash
        run: |
          set -euo pipefail
          version=1.22.0
          case "${{ runner.os }}" in
            Linux)   archive="onnxruntime-linux-x64-$version"; url="https://github.com/microsoft/onnxruntime/releases/download/v$version/$archive.tgz" ;;
            macOS)   archive="onnxruntime-osx-arm64-$version"; url="https://github.com/microsoft/onnxruntime/releases/download/v$version/$archive.tgz" ;;
            Windows) archive="onnxruntime-win-x64-$version"; url="https://github.com/microsoft/onnxruntime/releases/download/v$version/$archive.zip" ;;
          esac
          mkdir -p vendor
          if [ "${RUNNER_OS}" = "Windows" ]; then
            curl -sSL -o "$RUNNER_TEMP/$archive.zip" "$url"
            unzip -q "$RUNNER_TEMP/$archive.zip" -d vendor
          else
            curl -sSL "$url" | tar -xz -C vendor
          fi
          mv "vendor/$archive" vendor/onnxruntime
      # The sherpa build script extracts its native libraries into
      # target/sherpa-onnx-prebuilt and returns early when that directory exists, without
      # checking that the libraries are in it. rust-cache prunes large directories, so a
      # restored cache can leave the directory present and empty: the script skips the
      # download, prints a search path with nothing in it, and the link fails with
      # "could not find native static library". Removing the prebuilt directory is what
      # forces a real download; the build output and fingerprint go with it so the script
      # runs at all.
      - name: forget a cached native download
        shell: bash
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          rm -rf target/debug/build/sherpa-onnx-sys-*
          rm -rf target/debug/.fingerprint/sherpa-onnx-sys-*
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      # A fuzz target that stops compiling must fail the pull request, not sit
      # broken until the next scheduled run. This builds and never runs; the run
      # lives in fuzz.yml. libFuzzer has no Windows support, so the check runs on
      # the platform that scheduled job uses.
      - name: nightly for the fuzz targets
        if: runner.os == 'Linux'
        run: rustup toolchain install nightly --profile minimal
      - name: cargo-fuzz
        if: runner.os == 'Linux'
        run: cargo install cargo-fuzz --locked
      - name: the fuzz targets compile
        if: runner.os == 'Linux'
        working-directory: fuzz
        run: cargo +nightly fuzz build
