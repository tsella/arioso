name: win-diag

# One question, asked once: which onnxruntime.dll does the speech library load on Windows,
# and what does it expect? A recorded defect says the two disagree about the C API version
# and the mismatch aborts the process inside C++, which no test can catch.
#
# First run answered the first half: the vendored runtime is 1.22 (C API 22) and the runner
# also carries C:\Windows\System32\onnxruntime.dll at 1.17 (C API 17), which is what the
# abort names. This run asks the second half: if the vendored runtime is placed beside the
# test binaries, does the loader take it, and is 22 enough?
#
# It runs by hand only. It is a measurement, not a gate.

on:
  workflow_dispatch:

jobs:
  dlls:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: onnx runtime
        shell: bash
        run: |
          set -euo pipefail
          version=1.22.0
          archive="onnxruntime-win-x64-$version"
          url="https://github.com/microsoft/onnxruntime/releases/download/v$version/$archive.zip"
          mkdir -p vendor
          curl -sSL -o "$RUNNER_TEMP/$archive.zip" "$url"
          unzip -q "$RUNNER_TEMP/$archive.zip" -d vendor
          mv "vendor/$archive" vendor/onnxruntime
      - name: build the speech crate and its tests
        run: cargo test -p arioso-stt-sherpa --no-run
      - name: what is on the machine
        shell: pwsh
        run: |
          Write-Host "== onnxruntime.dll anywhere under the checkout =="
          Get-ChildItem -Path . -Recurse -Filter onnxruntime.dll -ErrorAction SilentlyContinue |
            ForEach-Object { "{0,-90} {1}" -f $_.FullName, $_.VersionInfo.FileVersion }
          Write-Host "== the system copy, if any =="
          $system = "$env:SystemRoot\System32\onnxruntime.dll"
          if (Test-Path $system) {
            "{0,-90} {1}" -f $system, (Get-Item $system).VersionInfo.FileVersion
          } else {
            "no $system"
          }
      - name: what the speech library asks for
        shell: pwsh
        run: |
          Write-Host "== libraries the build extracted =="
          Get-ChildItem -Path target -Recurse -Include *.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'sherpa' } |
            ForEach-Object { "{0,-90} {1}" -f $_.FullName, $_.Length }
          Write-Host "== import names inside them =="
          Get-ChildItem -Path target -Recurse -Include *.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'sherpa' } |
            ForEach-Object {
              $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
              $text = [System.Text.Encoding]::ASCII.GetString($bytes)
              $hit = $text -match 'onnxruntime\.dll'
              "{0}: imports onnxruntime.dll = {1}" -f $_.Name, $hit
            }
      - name: the quarantined test, before anything is moved
        continue-on-error: true
        shell: pwsh
        run: |
          cargo test -p arioso-stt-sherpa --lib a_transducer_entry_without_a_family_is_read_as_whisper -- --ignored --nocapture 2>&1 | Select-Object -Last 20
      - name: put the vendored runtime beside the test binaries, then run it again
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ChildItem -Path target/debug/deps -Filter arioso_stt_sherpa*.exe -ErrorAction SilentlyContinue |
            ForEach-Object { "test binary: $($_.FullName)" }
          Copy-Item vendor/onnxruntime/lib/*.dll target/debug/ -Force -ErrorAction SilentlyContinue
          Copy-Item vendor/onnxruntime/lib/*.dll target/debug/deps/ -Force -ErrorAction SilentlyContinue
          Write-Host "== after copying, what sits beside the binaries =="
          Get-ChildItem -Path target/debug/deps -Filter onnxruntime.dll -ErrorAction SilentlyContinue |
            ForEach-Object { "{0} {1}" -f $_.FullName, $_.VersionInfo.FileVersion }
          Write-Host "== the run =="
          cargo test -p arioso-stt-sherpa --lib a_transducer_entry_without_a_family_is_read_as_whisper -- --ignored --nocapture 2>&1 | Select-Object -Last 20
