# ONNX Runtime for the Piper engine. Place the prebuilt runtime in
# vendor/onnxruntime (see the README); an existing ORT_LIB_LOCATION wins.
[env]
ORT_LIB_LOCATION = { value = "vendor/onnxruntime", relative = true, force = false }

# Find the runtime at run time too, relative to the binary, so no
# LD_LIBRARY_PATH is needed. Two entries: one for target/<profile>/arioso and
# one for the test binaries under target/<profile>/deps.
[target.'cfg(target_os = "linux")']
rustflags = [
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../vendor/onnxruntime/lib",
  "-C", "link-arg=-Wl,-rpath,$ORIGIN/../../../vendor/onnxruntime/lib",
]

# The same two depths on macOS, where the loader spells it @loader_path. Without this
# the binary builds and then dies at startup with a missing dylib.
[target.'cfg(target_os = "macos")']
rustflags = [
  "-C", "link-arg=-Wl,-rpath,@loader_path/../../vendor/onnxruntime/lib",
  "-C", "link-arg=-Wl,-rpath,@loader_path/../../../vendor/onnxruntime/lib",
]
