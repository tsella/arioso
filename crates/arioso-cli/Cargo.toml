[package]
name = "arioso-cli"
description = "The arioso binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "arioso"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arioso-config.workspace = true
arioso-core.workspace = true
arioso-g2p.workspace = true
arioso-server.workspace = true
arioso-stt-sherpa.workspace = true
arioso-tts-piper.workspace = true
arioso-models.workspace = true
clap.workspace = true
serde_json.workspace = true
axum.workspace = true
axum-server.workspace = true
hyper-util.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# Reads the certificate `doctor` reports on. Pure Rust, no OpenSSL and no C toolchain, so
# the Windows build needs no headers the runner image does not have.
x509-parser = { version = "0.18", default-features = false }

[target.'cfg(unix)'.dependencies]
# Signal 0 asks whether a process exists, SIGTERM asks it to stop. Both are one call, and
# shelling out to `kill` would put a subprocess between the operator and the answer.
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
# Fixture certificates with chosen validity windows, so the three verdicts are exercised
# without a checked-in certificate that expires.
rcgen = "0.14"
time = "0.3"

[lints]
workspace = true
