[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Tom Sella"]
repository = "https://github.com/tsella/arioso"

[workspace.dependencies]
arioso-config = { path = "crates/arioso-config" }
arioso-models = { path = "crates/arioso-models" }
arioso-g2p = { path = "crates/arioso-g2p" }
arioso-server = { path = "crates/arioso-server" }
arioso-stt-sherpa = { path = "crates/arioso-stt-sherpa" }
arioso-vad = { path = "crates/arioso-vad" }
arioso-tts-piper = { path = "crates/arioso-tts-piper" }
arioso-core = { path = "crates/arioso-core" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
fs4 = "0.13"
futures-util = "0.3"
hex = "0.4"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
wiremock = "0.6"

[profile.release]
# One crate's work inlined into the next: the pipeline crosses four of them, and the
# boundaries were costing more than the code.
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
